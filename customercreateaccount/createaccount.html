<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquire Store | Create Account</title>
   <link rel="icon" type="image/png" href="../images/INQUIRE logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../customercreateaccount/create.css" />
</head>
<body class="auth-page">
  <a href="../customerlogin/login.html" class="hero-btn hero-btn-outline">Back to Home</a>
  <main class="card">
    <div class="brand">
      <img src="../images/INQUIRE logo.jpeg" alt="Inquire Store logo" />
      <h1>INQUIRE STORE</h1>
      <p>Create your account</p>
    </div>

    <form id="registerForm" action="authentication_customerregister.php" method="POST">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="name" required />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
      </div>

      <button class="btn" type="submit">CREATE ACCOUNT</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="helper">Already have an account? <a href="../customerlogin/login.html">Login</a></p>
    </form>
  </main>

 <script src="../create.js"></script>
</body>
</html>
