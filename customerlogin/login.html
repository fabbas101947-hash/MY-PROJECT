<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquire Store | Login</title>
  <link rel="icon" type="image/png" href="../image/INQUIRE logo.jpeg" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">
  <a href="../index.html" class="hero-btn hero-btn-outline">Back to Home</a>
  <main class="login-card">
    <div class="brand">
      <img src="../images/INQUIRE logo.jpeg" alt="Inquire Store logo" />
      <h1>INQUIRE STORE</h1>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" action="authentication_customerlogin.php" method="POST">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"/>
      </div>

      <div class="meta">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn" type="submit">LOGIN</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="signup">New to Inquire Store? <a href="../customercreateaccount/createaccount.html">Create account</a></p>
    </form>
  </main>
  <script src="login.js">
  </script>
</body>

</html>
